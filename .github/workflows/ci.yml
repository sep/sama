name: CI

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux_unit_tests:
    name: Unit Tests on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Run unit tests
        run: dotnet test SAMA.Tests.Unit/

  linux_integration_tests:
    name: Integration Tests on Linux
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: samadb
          POSTGRES_USER: sama
          POSTGRES_PASSWORD: sama-test-pw
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: samadb
      POSTGRES_USER: sama
      POSTGRES_PASSWORD: sama-test-pw
      SAMA_ENCRYPTION_KEY: test-encryption-key-for-ci-only

    steps:
      - uses: actions/checkout@v6
      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Run integration tests
        run: dotnet test SAMA.Tests.Integration/

  linux_system_tests:
    name: System Tests on Linux
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: samadb
          POSTGRES_USER: sama
          POSTGRES_PASSWORD: sama-test-pw
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      smtp:
        image: rnwood/smtp4dev:v3
        env:
          ServerOptions__Urls: http://*:80
        ports:
          - 6467:80
          - 6468:25
      oidc:
        image: ghcr.io/geigerzaehler/oidc-provider-mock:latest
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9400/.well-known/openid-configuration')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9400:9400
      ldap:
        image: thoteam/slapd-server-mock:latest
        ports:
          - 389:389

    env:
      TMPDIR: /tmp
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: samadb
      POSTGRES_USER: sama
      POSTGRES_PASSWORD: sama-test-pw
      SAMA_ENCRYPTION_KEY: test-encryption-key-for-ci-only

    steps:
      - name: Prepare OIDC user (this is done via Docker CMD in local dev)
        run: |
          curl 'http://localhost:9400/oauth2/authorize?response_type=code&client_id=my-client-id&scope=openid+email&redirect_uri=http://localhost:9400' --data-raw 'sub=alice'
          curl -XPUT 'http://localhost:9400/users/alice' --json '{"email": "alice@example.com", "name": "Alice"}'
      - uses: actions/checkout@v6
      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Build
        run: dotnet build SAMA.Tests.System/
      - name: Install Playwright browsers
        run: pwsh SAMA.Tests.System/bin/Debug/net10.0/playwright.ps1 install chromium
      - name: Run system tests
        env:
          RUN_SYSTEM_TESTS: 'true'
        run: |
          cd SAMA.Tests.System
          dotnet test --logger "console;verbosity=detailed"
      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: /tmp/sama-playwright-screenshots/
          retention-days: 7

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t sama:ci-test .
